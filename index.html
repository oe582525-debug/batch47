<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Batch-47 | Anonymous Feed</title>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-client@2"></script>
  <!-- html2pdf Library for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #050508;
      --card-bg: #0b0b10;
      --input-bg: #08080d;
      --border-color: #1a1618;
      --accent-red: #d9232e;
      --accent-red-hover: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #808493;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Watermark '47' */
    body::before {
      content: "47";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(220px, 55vw, 450px);
      font-weight: 900;
      color: rgba(217, 35, 46, 0.025);
      z-index: 0;
      pointer-events: none;
      font-family: 'Times New Roman', Georgia, serif;
      user-select: none;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 40px;
      height: 40px;
      background: #8e181f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(217, 35, 46, 0.3);
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: 'Georgia', serif;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 9px;
      color: var(--accent-red);
      letter-spacing: 1.4px;
      font-weight: 600;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .menu-btn:hover {
      background: rgba(217, 35, 46, 0.1);
    }

    /* Post Input Card */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .textarea-wrapper {
      background: var(--input-bg);
      border: 1px solid #161214;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
    }

    .post-input {
      width: 100%;
      height: 85px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }

    .post-input::placeholder {
      color: #4b4d58;
    }

    .word-counter {
      text-align: right;
      font-size: 11px;
      color: #636674;
      font-weight: 600;
      margin-top: 6px;
    }

    .word-counter.limit-near { color: #f59e0b; }
    .word-counter.limit-reached { color: #ef4444; }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .post-btn {
      background: var(--accent-red);
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(217, 35, 46, 0.4);
      transition: all 0.2s;
    }

    .post-btn:hover {
      background: var(--accent-red-hover);
      transform: translateY(-1px);
    }

    .post-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Timeline Bar */
    .timeline-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .timeline-title {
      color: #838896;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .expiry-text {
      color: #4b4e5a;
      letter-spacing: 0.3px;
    }

    /* Posts Feed List */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      transition: border-color 0.2s;
    }

    .post-card:hover {
      border-color: rgba(217, 35, 46, 0.2);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #636674;
    }

    .post-author-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .post-time {
      font-size: 11px;
      color: #525562;
    }

    .post-ip-badge {
      font-family: monospace;
      font-size: 10px;
      background: rgba(217, 35, 46, 0.15);
      color: #f43f5e;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(217, 35, 46, 0.3);
    }

    .post-content {
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .post-options-btn {
      background: transparent;
      border: none;
      color: #636674;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .post-options-btn:hover {
      color: var(--accent-red);
    }

    /* Menu Dropdown */
    .dropdown-menu {
      position: absolute;
      top: 60px;
      right: 16px;
      background: #101017;
      border: 1px solid #282836;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
      min-width: 220px;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 12px 16px;
      color: #d1d5db;
      font-size: 13px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .dropdown-item:hover {
      background: rgba(217, 35, 46, 0.15);
      color: #fff;
    }

    /* Modal System */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.show { display: flex; }

    .modal-box {
      background: #111116;
      border: 1px solid #23161a;
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #fff;
    }

    .modal-input {
      width: 100%;
      padding: 12px;
      background: #181820;
      border: 1px solid #2a2a38;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-input:focus { border-color: var(--accent-red); }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-cancel {
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-confirm {
      background: var(--accent-red);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .admin-indicator {
      background: rgba(217, 35, 46, 0.15);
      border: 1px solid var(--accent-red);
      color: #ff4d5a;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 14px;
      display: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Template for PDF Export */
    #pdf-container {
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    #pdf-container h2 {
      margin-bottom: 5px;
      color: #b91c1c;
    }

    .pdf-post-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
    }

    .pdf-meta {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand-section">
        <div class="logo-circle">47</div>
        <div class="title-group">
          <h1 class="brand-title">Batch-47</h1>
          <span class="brand-subtitle">ANONYMOUS FEED</span>
        </div>
      </div>
      <button class="menu-btn" id="menu-toggle-btn" title="Menu">⋮</button>
    </header>

    <!-- Navigation Dropdown Menu -->
    <div class="dropdown-menu" id="dropdown-menu">
      <button class="dropdown-item" id="export-pdf-btn">📄 Export 30 Days History (PDF)</button>
      <button class="dropdown-item" id="admin-login-btn">🔑 Admin Portal Login</button>
    </div>

    <!-- Admin Indicator Badge -->
    <div class="admin-indicator" id="admin-badge">⚡ LOGGED IN AS ADMIN</div>

    <!-- Post Input Box -->
    <section class="input-card">
      <div class="textarea-wrapper">
        <textarea 
          id="post-text" 
          class="post-input" 
          placeholder="Tell Batch-47 anonymously... (Max 47 words)"
        ></textarea>
        <div class="word-counter" id="word-count-display">0 / 47 words</div>
      </div>

      <div class="card-actions">
        <button class="post-btn" id="submit-post-btn">Post Now</button>
      </div>
    </section>

    <!-- Timeline Bar -->
    <div class="timeline-bar">
      <div class="timeline-title">
        <span class="live-dot"></span> LIVE TIMELINE
      </div>
      <div class="expiry-text">Auto-expires after 30 days</div>
    </div>

    <!-- Posts Container -->
    <main class="posts-list" id="posts-container">
      <div style="text-align: center; color: #636674; font-size: 13px; padding: 20px;">
        Loading feed...
      </div>
    </main>
  </div>

  <!-- Admin Login Modal -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-box">
      <div class="modal-title">Admin Login</div>
      <input type="password" id="admin-password-input" class="modal-input" placeholder="Enter Admin Password">
      <div class="modal-btns">
        <button class="btn-cancel" id="close-admin-modal">Cancel</button>
        <button class="btn-confirm" id="confirm-admin-login">Login</button>
      </div>
    </div>
  </div>

  <!-- PDF Export Container -->
  <div id="pdf-container"></div>

  <script>
    // ==========================================
    // 1. SUPABASE & CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "https://oeipqyttvkxqrtzesowb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9laXBxeXR0dmt4cXJ0emVzb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkzNjAsImV4cCI6MjEwNTMyNTM2MH0.nkZXFz89-9MhDqjnjOUS5QXp48m5FG91JqpdfxPifoE";
    const ADMIN_PASSWORD_HASH = "Golap204-14897-2022"; 

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let clientIp = "127.0.0.1";
    let isAdmin = false;
    let userDeviceId = localStorage.getItem("b47_device_id");

    if (!userDeviceId) {
      userDeviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      localStorage.setItem("b47_device_id", userDeviceId);
    }

    // Fetch Client IP Address
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => { clientIp = data.ip; })
      .catch(() => { clientIp = "Unknown IP"; });

    // Check Session Admin Status
    if (sessionStorage.getItem("b47_admin") === "true") {
      isAdmin = true;
      document.getElementById("admin-badge").style.display = "block";
    }

    // ==========================================
    // 2. WORD COUNT (Max 47 Words)
    // ==========================================
    const postTextInput = document.getElementById("post-text");
    const wordCountDisplay = document.getElementById("word-count-display");

    function getWordCount(str) {
      const trimmed = str.trim();
      return trimmed === "" ? 0 : trimmed.split(/\s+/).length;
    }

    postTextInput.addEventListener("input", () => {
      const count = getWordCount(postTextInput.value);
      wordCountDisplay.innerText = `${count} / 47 words`;

      if (count > 47) {
        wordCountDisplay.className = "word-counter limit-reached";
      } else if (count >= 40) {
        wordCountDisplay.className = "word-counter limit-near";
      } else {
        wordCountDisplay.className = "word-counter";
      }
    });

    // ==========================================
    // 3. POST SUBMISSION (Pure Text)
    // ==========================================
    const submitPostBtn = document.getElementById("submit-post-btn");

    submitPostBtn.addEventListener("click", async () => {
      const content = postTextInput.value.trim();
      const wordCount = getWordCount(content);

      if (!content) {
        alert("Please write something before posting!");
        return;
      }

      if (wordCount > 47) {
        alert("Maximum 47 words allowed per post!");
        return;
      }

      submitPostBtn.disabled = true;
      submitPostBtn.innerText = "Posting...";

      try {
        // Check Blocked IP Status
        const { data: blocked } = await db
          .from("blocked_ips")
          .select("ip")
          .eq("ip", clientIp)
          .single();

        if (blocked) {
          alert("Your IP address has been blocked from posting.");
          submitPostBtn.disabled = false;
          submitPostBtn.innerText = "Post Now";
          return;
        }

        // Insert Text Post
        const { error } = await db.from("posts").insert([
          {
            content: content,
            user_ip: clientIp,
            device_id: userDeviceId,
            created_at: new Date().toISOString()
          }
        ]);

        if (error) throw error;

        // Reset Textarea
        postTextInput.value = "";
        wordCountDisplay.innerText = "0 / 47 words";

      } catch (err) {
        alert("Failed to post: " + err.message);
      } finally {
        submitPostBtn.disabled = false;
        submitPostBtn.innerText = "Post Now";
      }
    });

    // ==========================================
    // 4. FETCH & REALTIME POSTS (30 Days Retention)
    // ==========================================
    const postsContainer = document.getElementById("posts-container");

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ', ' + date.toLocaleDateString();
    }

    async function fetchPosts() {
      // 30 Days Expiry Calculation
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

      const { data: posts, error } = await db
        .from("posts")
        .select("*")
        .gte("created_at", thirtyDaysAgo)
        .order("created_at", { ascending: false });

      if (error) {
        postsContainer.innerHTML = `<div style="text-align: center; color: #ef4444; font-size: 13px;">Error loading timeline!</div>`;
        return;
      }

      if (!posts || posts.length === 0) {
        postsContainer.innerHTML = `<div style="text-align: center; color: #636674; font-size: 13px; padding: 20px;">No messages yet. Be the first to post!</div>`;
        return;
      }

      postsContainer.innerHTML = posts.map(post => {
        const isOwner = post.device_id === userDeviceId;
        const canDelete = isOwner || isAdmin;

        return `
          <div class="post-card" id="post-${post.id}">
            <div class="post-header">
              <div class="post-author-info">
                <span>Anonymous</span>
                ${isAdmin ? `<span class="post-ip-badge">IP: ${post.user_ip}</span>` : ''}
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="post-time">${formatDate(post.created_at)}</span>
                ${canDelete ? `<button class="post-options-btn" onclick="deletePost('${post.id}')" title="Delete">🗑️</button>` : ''}
                ${isAdmin ? `<button class="post-options-btn" onclick="blockIp('${post.user_ip}')" title="Block IP">🚫</button>` : ''}
              </div>
            </div>
            <div class="post-content">${escapeHTML(post.content)}</div>
          </div>
        `;
      }).join("");
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Supabase Realtime Listener
    db.channel('public:posts')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
        fetchPosts();
      })
      .subscribe();

    fetchPosts();

    // ==========================================
    // 5. DELETION & BLOCKING ACTIONS
    // ==========================================
    window.deletePost = async (postId) => {
      if (confirm("Are you sure you want to delete this message?")) {
        const { error } = await db.from("posts").delete().eq("id", postId);
        if (error) alert("Could not delete message: " + error.message);
      }
    };

    window.blockIp = async (ipToBlock) => {
      if (confirm(`Are you sure you want to block IP: ${ipToBlock}?`)) {
        const { error } = await db.from("blocked_ips").insert([{ ip: ipToBlock }]);
        if (error) {
          alert("Failed to block IP: " + error.message);
        } else {
          alert(`IP ${ipToBlock} has been blocked.`);
        }
      }
    };

    // ==========================================
    // 6. MODALS & NAVIGATION
    // ==========================================
    const menuBtn = document.getElementById("menu-toggle-btn");
    const dropdownMenu = document.getElementById("dropdown-menu");
    const adminModal = document.getElementById("admin-modal");

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("show");
    });

    document.addEventListener("click", () => dropdownMenu.classList.remove("show"));

    document.getElementById("admin-login-btn").addEventListener("click", () => {
      dropdownMenu.classList.remove("show");
      adminModal.classList.add("show");
    });

    document.getElementById("close-admin-modal").addEventListener("click", () => {
      adminModal.classList.remove("show");
    });

    document.getElementById("confirm-admin-login").addEventListener("click", () => {
      const pwd = document.getElementById("admin-password-input").value;
      if (pwd === ADMIN_PASSWORD_HASH) {
        isAdmin = true;
        sessionStorage.setItem("b47_admin", "true");
        document.getElementById("admin-badge").style.display = "block";
        adminModal.classList.remove("show");
        document.getElementById("admin-password-input").value = "";
        fetchPosts();
        alert("Admin login successful!");
      } else {
        alert("Incorrect password!");
      }
    });

    // ==========================================
    // 7. EXPORT PDF BACKUP (30 Days History)
    // ==========================================
    document.getElementById("export-pdf-btn").addEventListener("click", async () => {
      dropdownMenu.classList.remove("show");
      
      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
      const { data: posts } = await db
        .from("posts")
        .select("*")
        .gte("created_at", thirtyDaysAgo)
        .order("created_at", { ascending: true });

      if (!posts || posts.length === 0) {
        alert("No chat history found for the last 30 days to export.");
        return;
      }

      const pdfContainer = document.getElementById("pdf-container");
      pdfContainer.style.display = "block";
      
      pdfContainer.innerHTML = `
        <h2>Batch-47 Anonymous Feed</h2>
        <p style="font-size: 12px; color: #555; margin-bottom: 15px;">Exported Chat History (Last 30 Days)</p>
        <div>
          ${posts.map(p => `
            <div class="pdf-post-item">
              <div class="pdf-meta">
                <strong>Anonymous</strong> ${isAdmin ? `[IP: ${p.user_ip}]` : ''} - ${formatDate(p.created_at)}
              </div>
              <div style="font-size: 13px;">${escapeHTML(p.content)}</div>
            </div>
          `).join('')}
        </div>
      `;

      const opt = {
        margin:       10,
        filename:     'Batch47_30Days_Chat_History.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        pdfContainer.style.display = "none";
      });
    });
  </script>
</body>
</html>
