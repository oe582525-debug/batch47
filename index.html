<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Batch-47 — Anonymous Feed</title>
  <meta name="description" content="Official anonymous feed for Batch-47. Minimalist, WhatsApp-inspired feed with real-time updates and strict 47-word limit." />

  <!-- Premium Typography: Plus Jakarta Sans (High-Contrast Bold UI & Body) and JetBrains Mono (Technical Counters) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2pdf.js for Clean PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ==========================================================================
       CSS RESET, RIGOROUS NON-ZOOM & SECURITY RULES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    :root {
      /* Primary Crimson Palette */
      --crimson-start: #B93838;
      --crimson-end: #9E2A2A;
      --crimson-accent: #DC2626;
      --crimson-hover: #EF4444;
      --crimson-active: #991B1B;
      --crimson-glow: rgba(220, 38, 38, 0.35);

      /* WhatsApp-Inspired Slate & Obsidian Palette */
      --bg-canvas: #0B0E14;
      --bg-panel: #111722;
      --bg-card: #161F30;
      --bg-card-hover: #1C273D;
      --bg-bubble-self: #1A2333;
      --bg-input: #0D131E;

      /* Crisp Borders */
      --border-subtle: #243044;
      --border-crisp: #334155;
      --border-glow: rgba(220, 38, 38, 0.4);

      /* Typography & Text Shades */
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --text-white: #FFFFFF;
      --text-cream: #FFFDF9;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-dim: #475569;

      /* Status Colors */
      --color-warning: #F59E0B;

      /* Radii */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-card: 16px;
      --radius-pill: 9999px;

      /* Shadows */
      --shadow-header: 0 4px 20px rgba(0, 0, 0, 0.35);
      --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.25);
      --shadow-bubble: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding-bottom: 3.5rem;
    }

    /* Subtle Geometric Background Watermark */
    body::before {
      content: "47";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: var(--font-main);
      font-weight: 900;
      font-size: clamp(240px, 45vw, 420px);
      line-height: 1;
      color: rgba(220, 38, 38, 0.025);
      pointer-events: none;
      z-index: 0;
      user-select: none;
    }

    /* App Shell Container */
    .app-viewport {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    /* ==========================================================================
       1. HEADER DESIGN (CLEAN, MINIMAL, CRIMSON GRADIENT)
       ========================================================================== */
    .app-header {
      width: 100%;
      background: linear-gradient(135deg, var(--crimson-start) 0%, var(--crimson-end) 100%);
      box-shadow: var(--shadow-header);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .header-branding {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      user-select: none;
    }

    /* Stylized "47" Geometric Logo Badge */
    .logo-badge {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.14);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.25), 0 2px 8px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .logo-badge svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--text-cream);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Header Titles */
    .branding-titles {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.08rem;
    }

    .title-line-1 {
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text-cream);
      line-height: 1.15;
      text-transform: uppercase;
    }

    .title-line-2 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: rgba(255, 253, 249, 0.82);
      line-height: 1.15;
      text-transform: uppercase;
    }

    /* Header Right Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      position: relative;
    }

    .btn-header-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.14s ease;
      outline: none;
    }

    .btn-header-icon:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.04);
    }

    .btn-header-icon:active {
      transform: scale(0.96);
    }

    .btn-header-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Options Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border-crisp);
      border-radius: var(--radius-md);
      padding: 0.4rem;
      min-width: 210px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      z-index: 120;
      animation: menuFadeIn 0.18s ease forwards;
    }

    .dropdown-menu.show {
      display: flex;
    }

    @keyframes menuFadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.9rem;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      border: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .dropdown-item:hover {
      background: rgba(220, 38, 38, 0.15);
      color: var(--text-white);
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== */
    .app-main {
      width: 100%;
      padding: 1.25rem 1rem 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ==========================================================================
       2. INPUT COMPONENT (16PX RADIUS CARD, STRICT 47-WORD LIMIT)
       ========================================================================== */
    .composer-card {
      width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-crisp);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .composer-card:focus-within {
      border-color: var(--crimson-accent);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35), 0 0 15px var(--crimson-glow);
    }

    .composer-textarea-box {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1rem;
      transition: border-color 0.18s ease;
    }

    .composer-card:focus-within .composer-textarea-box {
      border-color: rgba(220, 38, 38, 0.5);
    }

    /* Strictly allows text selection inside textarea ONLY, min 16px font to prevent iOS zoom */
    .composer-textarea {
      width: 100%;
      min-height: 80px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-white);
      font-family: var(--font-main);
      font-size: 16px; /* 16px prevents iOS Safari auto-zoom on input focus */
      font-weight: 500;
      line-height: 1.6;
      resize: none;
      word-break: break-word;
      user-select: text;
      -webkit-user-select: text;
    }

    .composer-textarea::placeholder {
      color: var(--text-dim);
      font-weight: 600;
      user-select: none;
    }

    /* Action Row: Counter + Post Now Action Button */
    .composer-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.2rem;
    }

    .word-counter-pill {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--bg-input);
      padding: 0.38rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-subtle);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.18s ease;
      user-select: none;
    }

    .word-counter-pill.is-warning {
      color: var(--color-warning);
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
    }

    .word-counter-pill.is-limit {
      color: var(--crimson-accent);
      border-color: rgba(220, 38, 38, 0.5);
      background: rgba(220, 38, 38, 0.1);
      font-weight: 800;
    }

    .btn-post-broadcast {
      background: var(--crimson-accent);
      color: var(--text-white);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.65rem 1.45rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px var(--crimson-glow);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      user-select: none;
    }

    .btn-post-broadcast:hover:not(:disabled) {
      background: var(--crimson-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.45);
    }

    .btn-post-broadcast:active:not(:disabled) {
      background: var(--crimson-active);
      transform: translateY(1px) scale(0.98);
    }

    .btn-post-broadcast:disabled {
      background: #243044;
      color: #64748B;
      border-color: transparent;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      opacity: 0.7;
    }

    .btn-post-broadcast svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       TIMELINE METADATA BAR
       ========================================================================== */
    .timeline-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.3rem 0.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .timeline-title {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .timeline-title-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--crimson-accent);
      box-shadow: 0 0 8px var(--crimson-accent);
    }

    .timeline-expiry-badge {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ==========================================================================
       3. FEED & SPEECH-BUBBLE CARDS (WHATSAPP-INSPIRED)
       ========================================================================== */
    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    /* Speech Bubble Feed Card */
    .speech-bubble-card {
      background: var(--bg-card);
      border: 1px solid var(--border-crisp);
      border-radius: 18px 18px 18px 4px;
      padding: 1.15rem 1.25rem;
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      position: relative;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      cursor: default;
      user-select: none;
    }

    .speech-bubble-card:hover {
      border-color: rgba(220, 38, 38, 0.45);
      background: var(--bg-card-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    /* User's own card: highlights & supports long-press to delete */
    .speech-bubble-card.is-self {
      border-left: 3.5px solid var(--crimson-accent);
      background: var(--bg-bubble-self);
      cursor: pointer;
    }

    /* Visual feedback while user is holding (long-pressing) */
    .speech-bubble-card.is-pressing {
      transform: scale(0.985);
      border-color: var(--crimson-accent);
      box-shadow: 0 0 22px var(--crimson-glow);
    }

    /* Bubble Header: Tag, Timestamp */
    .bubble-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    .bubble-author-group {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    /* Standard "Anonymous Feed" Tag */
    .tag-anonymous-feed {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-crisp);
      padding: 0.22rem 0.6rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }

    .tag-anonymous-feed svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    /* Crimson "My Post" Tag for current user's posts */
    .tag-my-post {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(220, 38, 38, 0.18);
      color: #FF5A5A;
      border: 1.5px solid var(--crimson-accent);
      padding: 0.22rem 0.65rem;
      border-radius: var(--radius-pill);
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
    }

    .tag-my-post svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
    }

    .bubble-meta-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .bubble-time {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      font-family: var(--font-mono);
    }

    /* Bubble Message Text */
    .bubble-content {
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-cream);
      word-break: break-word;
      white-space: pre-wrap;
    }

    /* Empty Feed Card */
    .empty-state-card {
      background: var(--bg-panel);
      border: 1px dashed var(--border-crisp);
      border-radius: var(--radius-card);
      padding: 3rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }

    /* Clean pulse animation for Connecting to Feed state */
    .loading-pulse-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(220, 38, 38, 0.2);
      border-top-color: var(--crimson-accent);
      animation: spinRing 0.85s linear infinite;
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    .empty-state-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text-white);
    }

    /* ==========================================================================
       4. LONG-PRESS DELETE CONFIRMATION MODAL (DARK & PROFESSIONAL)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 250;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: var(--bg-panel);
      border: 1px solid var(--border-crisp);
      border-radius: var(--radius-card);
      padding: 1.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(220, 38, 38, 0.2);
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      transform: scale(0.94);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.show .modal-dialog {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .modal-icon-badge {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.35);
      color: var(--crimson-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-icon-badge svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
    }

    .modal-title-box h3 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-white);
    }

    .modal-title-box p {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .modal-snippet-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--crimson-accent);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      color: var(--text-cream);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.5;
      max-height: 100px;
      overflow-y: auto;
      word-break: break-word;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    .btn-modal-cancel {
      background: transparent;
      border: 1px solid var(--border-crisp);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      outline: none;
    }

    .btn-modal-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-white);
    }

    .btn-modal-cancel:active {
      transform: scale(0.97);
    }

    .btn-modal-delete {
      background: var(--crimson-accent);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-white);
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 800;
      padding: 0.6rem 1.35rem;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 14px var(--crimson-glow);
      transition: background 0.15s ease, transform 0.14s ease;
      outline: none;
    }

    .btn-modal-delete:hover {
      background: var(--crimson-hover);
    }

    .btn-modal-delete:active {
      background: var(--crimson-active);
      transform: scale(0.97);
    }

    /* ==========================================================================
       TOAST NOTIFICATION
       ========================================================================== */
    .toast-banner {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #111722;
      border: 1.5px solid var(--crimson-accent);
      color: var(--text-white);
      padding: 0.75rem 1.35rem;
      border-radius: var(--radius-pill);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px var(--crimson-glow);
      font-size: 0.88rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      z-index: 300;
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* PDF Staging Container: positioned off-screen with explicit A4 width so html2canvas can measure and render multi-page documents seamlessly */
    #pdfStagingArea {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 760px;
      background: #ffffff;
      z-index: -9999;
      pointer-events: none;
    }

    /* ==========================================================================
       RESPONSIVENESS
       ========================================================================== */
    @media (max-width: 600px) {
      .app-header {
        padding: 0.75rem 1rem;
      }
      .logo-badge {
        width: 40px;
        height: 40px;
      }
      .title-line-1 {
        font-size: 1.15rem;
      }
      .title-line-2 {
        font-size: 0.65rem;
        letter-spacing: 0.15em;
      }
      .composer-card {
        padding: 1rem;
      }
      .speech-bubble-card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Hidden PDF Staging Container -->
  <div id="pdfStagingArea"></div>

  <!-- Toast Notification Alert -->
  <div class="toast-banner" id="toastNotification">
    <span id="toastMsg">Notification</span>
  </div>

  <!-- Long-Press Post Deletion Confirmation Modal -->
  <div class="modal-overlay" id="deleteConfirmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-icon-badge">
          <svg viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </div>
        <div class="modal-title-box">
          <h3 id="modalTitle">Delete This Post?</h3>
          <p>Author Deletion Confirmation</p>
        </div>
      </div>

      <div class="modal-snippet-box" id="modalPostSnippet">
        <!-- Injected snippet -->
      </div>

      <div class="modal-actions">
        <button class="btn-modal-cancel" id="btnCancelModal">Cancel</button>
        <button class="btn-modal-delete" id="btnConfirmModalDelete">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
          <span>Delete Post</span>
        </button>
      </div>
    </div>
  </div>

  <div class="app-viewport">

    <!-- ========================================================================
         1. CLEAN & MINIMAL HEADER WITH CRIMSON GRADIENT (NO "LIVE" BADGES)
         ======================================================================== -->
    <header class="app-header">
      <a href="#" class="header-branding" aria-label="Batch-47 Anonymous Feed Home">
        <!-- Stylized "47" Geometric Logo Badge -->
        <div class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <!-- Geometric 4 -->
            <path d="M14 6 L7 17 L17 17 M14 11 L14 26" />
            <!-- Geometric 7 -->
            <path d="M19 6 L27 6 L20 26" />
          </svg>
        </div>

        <!-- Typography Branding: Line 1 BATCH-47 / Line 2 ANONYMOUS FEED -->
        <div class="branding-titles">
          <div class="title-line-1">BATCH-47</div>
          <div class="title-line-2">ANONYMOUS FEED</div>

      <!-- Header Right: Minimal Options Dropdown -->
      <div class="header-actions">
        <button class="btn-header-icon" id="btnOptionsMenu" title="Feed Options" aria-label="Feed Options">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="2" />
            <circle cx="12" cy="12" r="2" />

        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item" id="btnExportPdf">
            <svg viewBox="0 0 24 24">
              <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="18" x2="12" y2="12" />
              <polyline points="9 15 12 18 15 15" />
            </svg>
            Export Feed History (PDF)
          </button>
        </div>
      </div>
    </header>

    <!-- ========================================================================
         MAIN CONTENT AREA
         ======================================================================== -->
    <main class="app-main">

      <!-- ====================================================================
           2. INPUT COMPONENT (16PX RADIUS CARD, CLEAN MINIMAL PLACEHOLDER)
           ==================================================================== -->
      <section class="composer-card" aria-label="Create Anonymous Post">
        <div class="composer-textarea-box">
          <textarea
            id="postContentInput"
            class="composer-textarea"
            placeholder="Tell Batch-47 anonymously..."
            rows="3"
            maxlength="1000"
          ></textarea>
        </div>

        <div class="composer-action-row">
          <!-- Real-Time Word Counter -->
          <div class="word-counter-pill" id="wordCountBadge">
            <span id="wordCountVal">0</span> / 47 words
          </div>

          <!-- Bold, Sleek Crimson Post Now Action Button -->
          <button id="btnBroadcastPost" class="btn-post-broadcast" disabled>
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            <span>Post Now</span>
          </button>
        </div>
      </section>

      <!-- ====================================================================
           TIMELINE HEADER
           ==================================================================== -->
      <div class="timeline-bar">
        <div class="timeline-title">
          <span class="timeline-title-dot"></span>
          <span>Anonymous Feed</span>
        </div>
        <div class="timeline-expiry-badge">
          Dynamic capacity
        </div>
      </div>

      <!-- ====================================================================
           3. TIMELINE & FEED CARDS (WHATSAPP-LIKE SPEECH BUBBLES)
           ==================================================================== -->
      <section class="feed-list" id="feedCardsContainer" aria-label="Anonymous Message Stream">
        <!-- Clean loading state: spinner and primary bold heading only -->
        <div class="empty-state-card" id="initialLoadingState">
          <div class="loading-pulse-ring"></div>
          <div class="empty-state-title">Connecting to Feed...</div>
        </div>
      </section>

    </main>

  </div>

  <!-- ==========================================================================
       JAVASCRIPT APPLICATION LOGIC & SUPABASE INTEGRATION
       ========================================================================== -->
  <script>
    (function () {
      'use strict';

      // ------------------------------------------------------------------------
      // 1. SUPABASE CLIENT INITIALIZATION & CONFIGURATION
      // ------------------------------------------------------------------------
      // Root project URL sanitized to ensure clean API endpoints
      const RAW_SUPABASE_URL = 'https://rlkygmydqazegeaqnzlv.supabase.co/rest/v1/';
      const SUPABASE_URL = RAW_SUPABASE_URL.replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsa3lnbXlkcWF6ZWdlYXFuemx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkwMzEsImV4cCI6MjEwNTMyNTAzMX0.BIseGNs3rT-uuoS5cFR2wl34JqVpW821ZTFfgP0f_2I';
      const DATABASE_TABLE = 'anonymous_posts';

      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
      } catch (err) {
        console.warn('Supabase client failed to initialize:', err);
      }

      // ------------------------------------------------------------------------
      // 2. USER ANONYMOUS IDENTITY
      // ------------------------------------------------------------------------
      const STORAGE_KEY_USER = 'b47_user_anon_token_v3';
      const STORAGE_KEY_POSTS = 'b47_cached_feed_v3';

      let myAnonId = localStorage.getItem(STORAGE_KEY_USER);
      if (!myAnonId) {
        const randHex = Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, '0');
        myAnonId = `anon_${randHex}`;
        localStorage.setItem(STORAGE_KEY_USER, myAnonId);
      }

      // ------------------------------------------------------------------------
      // 3. DOM ELEMENTS
      // ------------------------------------------------------------------------
      const postContentInput = document.getElementById('postContentInput');
      const wordCountBadge = document.getElementById('wordCountBadge');
      const wordCountVal = document.getElementById('wordCountVal');
      const btnBroadcastPost = document.getElementById('btnBroadcastPost');
      const feedCardsContainer = document.getElementById('feedCardsContainer');
      const btnOptionsMenu = document.getElementById('btnOptionsMenu');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const btnExportPdf = document.getElementById('btnExportPdf');
      const toastNotification = document.getElementById('toastNotification');
      const toastMsg = document.getElementById('toastMsg');
      const pdfStagingArea = document.getElementById('pdfStagingArea');

      // Modal elements
      const deleteConfirmModal = document.getElementById('deleteConfirmModal');
      const modalPostSnippet = document.getElementById('modalPostSnippet');
      const btnCancelModal = document.getElementById('btnCancelModal');
      const btnConfirmModalDelete = document.getElementById('btnConfirmModalDelete');

      let feedPosts = [];
      let isBroadcasting = false;
      let toastTimer = null;
      let pendingDeletePostId = null;

      // ------------------------------------------------------------------------
      // 4. UTILITIES & HELPERS
      // ------------------------------------------------------------------------
      function showToast(message) {
        if (!toastNotification || !toastMsg) return;
        toastMsg.textContent = message;
        toastNotification.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastNotification.classList.remove('show');
        }, 3000);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function countWords(text) {
        if (!text) return 0;
        const trimmed = text.trim();
        if (!trimmed) return 0;
        return trimmed.split(/\s+/).filter(Boolean).length;
      }

      function formatRelativeTime(isoString) {
        if (!isoString) return 'Just now';
        try {
          const date = new Date(isoString);
          const now = new Date();
          const diffSec = Math.floor((now - date) / 1000);

          if (diffSec < 45) return 'Just now';
          const diffMin = Math.floor(diffSec / 60);
          if (diffMin < 60) return `${diffMin}m ago`;
          const diffHr = Math.floor(diffMin / 60);
          if (diffHr < 24) return `${diffHr}h ago`;
          const diffDay = Math.floor(diffHr / 24);
          if (diffDay < 365) return `${diffDay}d ago`;

          return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        } catch (e) {
          return 'Recent';
        }
      }

      // ------------------------------------------------------------------------
      // 5. WORD COUNT & STRICT 47-WORD LIMIT ENFORCEMENT
      // ------------------------------------------------------------------------
      function handleComposerInput() {
        if (!postContentInput || !wordCountVal || !wordCountBadge || !btnBroadcastPost) return;

        let rawText = postContentInput.value;
        const words = rawText.trim().split(/\s+/).filter(Boolean);
        let numWords = words.length;

        // Strict 47-Word Cap Enforcement: Truncate typed/pasted text exceeding 47 words
        if (numWords > 47) {
          const allowedWords = words.slice(0, 47);
          postContentInput.value = allowedWords.join(' ');
          numWords = 47;
          showToast('Word limit reached: 47 words maximum');
        }

        wordCountVal.textContent = numWords;

        // Word count styling transitions
        wordCountBadge.classList.remove('is-warning', 'is-limit');
        if (numWords >= 40 && numWords < 47) {
          wordCountBadge.classList.add('is-warning');
        } else if (numWords >= 47) {
          wordCountBadge.classList.add('is-limit');
        }

        // Enable or disable Broadcast button
        const canSubmit = (numWords > 0 && numWords <= 47 && !isBroadcasting);
        btnBroadcastPost.disabled = !canSubmit;
      }

      if (postContentInput) {
        postContentInput.addEventListener('input', handleComposerInput);
        postContentInput.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            if (!btnBroadcastPost.disabled) broadcastNewPost();
          }
        });
      }

      // ------------------------------------------------------------------------
      // 6. RENDER FEED SPEECH BUBBLE CARDS
      // ------------------------------------------------------------------------
      function renderFeed() {
        if (!feedCardsContainer) return;

        if (!feedPosts || feedPosts.length === 0) {
          feedCardsContainer.innerHTML = `
            <div class="empty-state-card">
              <div class="empty-state-title">No broadcasts yet</div>
            </div>
          `;
          return;
        }

        feedCardsContainer.innerHTML = feedPosts.map(post => {
          const isSelf = (post.user_id === myAnonId);
          const timeFormatted = formatRelativeTime(post.created_at);

          return `
            <article 
              class="speech-bubble-card ${isSelf ? 'is-self' : ''}" 
              id="card-${post.id}"
              data-id="${post.id}"
              ${isSelf ? 'title="Hold (long-press) to delete this post"' : ''}
            >
              <div class="bubble-header">
                <div class="bubble-author-group">
                  ${isSelf ? `
                    <!-- Bold Crimson My Post Tag -->
                    <span class="tag-my-post">
                      <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                      </svg>
                      <span>My Post</span>
                    </span>
                  ` : `
                    <!-- Standard Anonymous Feed Tag -->
                    <span class="tag-anonymous-feed">
                      <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                      </svg>
                      <span>Anonymous Feed</span>
                    </span>
                  `}
                </div>
                <div class="bubble-meta-right">
                  <time class="bubble-time" datetime="${post.created_at}">${escapeHtml(timeFormatted)}</time>
                </div>
              </div>

              <div class="bubble-content">${escapeHtml(post.content)}</div>
            </article>
          `;
        }).join('');

        // Attach Long-Press Listeners to current user's "My Post" cards
        attachLongPressHandlers();
      }

      // ------------------------------------------------------------------------
      // 7. LONG-PRESS LOGIC FOR "MY POST" CARDS
      // ------------------------------------------------------------------------
      function attachLongPressHandlers() {
        const selfCards = feedCardsContainer.querySelectorAll('.speech-bubble-card.is-self');
        const HOLD_DURATION_MS = 550;

        selfCards.forEach(card => {
          const postId = card.getAttribute('data-id');
          let pressTimer = null;
          let startX = 0;
          let startY = 0;

          function startPress(e) {
            if (e.type === 'touchstart') {
              startX = e.touches[0].clientX;
              startY = e.touches[0].clientY;
            } else if (e.button !== 0) {
              return; // only primary mouse click
            }

            card.classList.add('is-pressing');
            clearTimeout(pressTimer);

            pressTimer = setTimeout(() => {
              card.classList.remove('is-pressing');
              if (navigator.vibrate) navigator.vibrate(40);
              openDeleteModal(postId);
            }, HOLD_DURATION_MS);
          }

          function cancelPress(e) {
            clearTimeout(pressTimer);
            card.classList.remove('is-pressing');
          }

          function movePress(e) {
            if (e.type === 'touchmove') {
              const dx = Math.abs(e.touches[0].clientX - startX);
              const dy = Math.abs(e.touches[0].clientY - startY);
              if (dx > 10 || dy > 10) {
                cancelPress();
              }
            }
          }

          // Touch events
          card.addEventListener('touchstart', startPress, { passive: true });
          card.addEventListener('touchend', cancelPress);
          card.addEventListener('touchcancel', cancelPress);
          card.addEventListener('touchmove', movePress, { passive: true });

          // Mouse events (desktop long-click hold)
          card.addEventListener('mousedown', startPress);
          card.addEventListener('mouseup', cancelPress);
          card.addEventListener('mouseleave', cancelPress);
        });
      }

      // Open Delete Confirmation Modal
      function openDeleteModal(postId) {
        const post = feedPosts.find(p => p.id === postId);
        if (!post) return;

        pendingDeletePostId = postId;
        if (modalPostSnippet) {
          modalPostSnippet.textContent = post.content;
        }
        if (deleteConfirmModal) {
          deleteConfirmModal.classList.add('show');
        }
      }

      function closeDeleteModal() {
        pendingDeletePostId = null;
        if (deleteConfirmModal) {
          deleteConfirmModal.classList.remove('show');
        }
      }

      if (btnCancelModal) {
        btnCancelModal.addEventListener('click', closeDeleteModal);
      }

      if (deleteConfirmModal) {
        deleteConfirmModal.addEventListener('click', (e) => {
          if (e.target === deleteConfirmModal) closeDeleteModal();
        });
      }

      if (btnConfirmModalDelete) {
        btnConfirmModalDelete.addEventListener('click', async () => {
          if (!pendingDeletePostId) return;
          const targetId = pendingDeletePostId;
          closeDeleteModal();
          await executePostDeletion(targetId);
        });
      }

      // ------------------------------------------------------------------------
      // 8. EXECUTE POST DELETION (OWNER ONLY)
      // ------------------------------------------------------------------------
      async function executePostDeletion(postId) {
        try {
          if (supabaseClient) {
            const { error } = await supabaseClient
              .from(DATABASE_TABLE)
              .delete()
              .eq('id', postId)
              .eq('user_id', myAnonId);

            if (error) throw error;
          }

          feedPosts = feedPosts.filter(p => p.id !== postId);
          renderFeed();
          try {
            localStorage.setItem(STORAGE_KEY_POSTS, JSON.stringify(feedPosts));
          } catch (e) {}
          showToast('Post deleted successfully');
        } catch (err) {
          console.error('Delete failed:', err);
          showToast('Could not delete post.');
        }
      }

      // ------------------------------------------------------------------------
      // 9. HTTP POLLING: FETCH MESSAGES FROM SUPABASE (5-SECOND INTERVAL)
      // ------------------------------------------------------------------------
      async function fetchMessages() {
        if (!supabaseClient) return;

        try {
          // Simple SELECT query via Supabase Client SDK to retrieve latest messages
          const { data, error } = await supabaseClient
            .from(DATABASE_TABLE)
            .select('id, content, user_id, created_at')
            .order('created_at', { ascending: false })
            .limit(100);

          if (error) {
            console.warn('Error polling messages from Supabase:', error.message || error);
            return;
          }

          if (Array.isArray(data)) {
            const freshPosts = data;

            // Update feed if records or message content have changed
            const hasChanged = (freshPosts.length !== feedPosts.length) ||
              freshPosts.some((post, idx) => {
                const existing = feedPosts[idx];
                return !existing ||
                  existing.id !== post.id ||
                  existing.content !== post.content;
              });

            if (hasChanged || feedPosts.length === 0) {
              feedPosts = freshPosts;
              renderFeed();
              try {
                localStorage.setItem(STORAGE_KEY_POSTS, JSON.stringify(feedPosts));
              } catch (e) {}
            }
          }
        } catch (err) {
          // Error handling ensures no console crashes or unhandled rejections
          console.warn('Polling network exception handled:', err);
        }
      }

      // Reusable alias for backwards compatibility
      const fetchRecentFeed = fetchMessages;

      // ------------------------------------------------------------------------
      // 9b. DYNAMIC FIFO CAPACITY PURGE HELPER
      // ------------------------------------------------------------------------
      async function enforceFifoCapacityPurge() {
        if (!supabaseClient) return;
        try {
          // Execute server-side FIFO purge routine if configured
          await supabaseClient.rpc('purge_excess_posts_fifo');
        } catch (e) {
          // Fail-safe: Database trigger handles automatic FIFO capacity purge on insert
        }
      }

      // ------------------------------------------------------------------------
      // 10. BROADCAST NEW POST
      // ------------------------------------------------------------------------
      async function broadcastNewPost() {
        if (!postContentInput) return;
        const content = postContentInput.value.trim();
        const wordCount = countWords(content);

        if (wordCount === 0 || wordCount > 47) {
          showToast('Please enter between 1 and 47 words.');
          return;
        }

        isBroadcasting = true;
        btnBroadcastPost.disabled = true;
        btnBroadcastPost.innerHTML = 'Broadcasting...';

        try {
          if (!supabaseClient) throw new Error('Supabase client is not available');

          const newPostPayload = {
            content: content,
            user_id: myAnonId
          };

          const { data, error } = await supabaseClient
            .from(DATABASE_TABLE)
            .insert([newPostPayload])
            .select('id, content, user_id, created_at');

          if (error) throw error;

          // Trigger dynamic capacity purge check (FIFO)
          enforceFifoCapacityPurge();

          // Clear textarea & reset word counter
          postContentInput.value = '';
          handleComposerInput();
          showToast('Message broadcasted to Batch-47! 🚀');

          // If select returned data, prepend to feed immediately
          if (data && data[0]) {
            const inserted = data[0];
            feedPosts = [inserted, ...feedPosts.filter(p => p.id !== inserted.id)];
            renderFeed();
            try {
              localStorage.setItem(STORAGE_KEY_POSTS, JSON.stringify(feedPosts));
            } catch (e) {}
          } else {
            await fetchMessages();
          }
        } catch (err) {
          console.error('Broadcast failed:', err);
          showToast(err.message || 'Failed to post. Check connection.');
        } finally {
          isBroadcasting = false;
          btnBroadcastPost.innerHTML = `
            <svg viewBox="0 0 24 24">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
            <span>Post Now</span>
          `;
          handleComposerInput();
        }
      }

      if (btnBroadcastPost) {
        btnBroadcastPost.addEventListener('click', broadcastNewPost);
      }

      // ------------------------------------------------------------------------
      // 11. OPTIONS MENU & PDF HISTORY EXPORT
      // ------------------------------------------------------------------------
      if (btnOptionsMenu && dropdownMenu) {
        btnOptionsMenu.addEventListener('click', (e) => {
          e.stopPropagation();
          dropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => {
          dropdownMenu.classList.remove('show');
        });
      }

      if (btnExportPdf) {
        btnExportPdf.addEventListener('click', async () => {
          dropdownMenu.classList.remove('show');

          if (!feedPosts || feedPosts.length === 0) {
            showToast('No feed posts to export.');
            return;
          }

          if (typeof html2pdf === 'undefined') {
            showToast('PDF library loading, please try again in a moment');
            return;
          }

          showToast('Generating PDF export...');

          // Format generation date and time
          const generatedDateStr = new Date().toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          // Build clean, professional printable HTML with page-break-inside avoid
          pdfStagingArea.innerHTML = `
            <div style="font-family:'Helvetica Neue',Arial,sans-serif;color:#0f172a;padding:36px;background:#ffffff;box-sizing:border-box;width:100%;">
              <!-- PDF Document Header -->
              <div style="border-bottom:2.5px solid #DC2626;padding-bottom:18px;margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;">
                <div>
                  <div style="font-size:24px;color:#9E2A2A;font-weight:900;letter-spacing:0.04em;line-height:1.15;margin:0;">BATCH-47</div>
                  <div style="font-size:11px;color:#64748B;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;margin-top:5px;">Official Anonymous Feed History</div>
                </div>
                <div style="text-align:right;font-size:11px;color:#64748B;font-weight:600;line-height:1.45;">
                  <div>Export Date: ${generatedDateStr}</div>
                  <div>Total Posts: ${feedPosts.length}</div>
                </div>
              </div>

              <!-- Message Stream List -->
              <div style="display:flex;flex-direction:column;gap:12px;">
                ${feedPosts.map((p, i) => {
                  const isAuthor = (p.user_id === myAnonId);
                  const postTime = new Date(p.created_at).toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                  });

                  return `
                    <div style="border:1px solid #CBD5E1;border-left:4px solid ${isAuthor ? '#DC2626' : '#475569'};border-radius:8px;padding:14px 18px;background:#F8FAFC;page-break-inside:avoid;break-inside:avoid;margin-bottom:12px;">
                      <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px;font-weight:700;">
                        <span style="text-transform:uppercase;color:${isAuthor ? '#B93838' : '#334155'};letter-spacing:0.04em;">
                          #${i + 1} • ${isAuthor ? 'My Post' : 'Anonymous Feed'}
                        </span>
                        <span style="font-family:monospace;font-size:10px;color:#64748B;">${postTime}</span>
                      </div>
                      <div style="font-size:13px;line-height:1.6;color:#0F172A;font-weight:500;word-break:break-word;white-space:pre-wrap;">
                        ${escapeHtml(p.content)}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

              <!-- PDF Document Footer -->
              <div style="margin-top:32px;border-top:1px solid #E2E8F0;padding-top:14px;font-size:10px;color:#94A3B8;text-align:center;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">
                Batch-47 Community • Confidential Anonymous Archive
              </div>
            </div>
          `;

          // Allow the DOM to compute geometry and fonts accurately
          await new Promise(resolve => setTimeout(resolve, 150));

          const opt = {
            margin: [10, 10, 12, 10],
            filename: `Batch-47-Feed-History-${new Date().toISOString().slice(0, 10)}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: {
              scale: 2,
              useCORS: true,
              logging: false,
              scrollY: 0
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
          };

          try {
            await html2pdf().set(opt).from(pdfStagingArea).save();
            showToast('PDF Exported Successfully! 📄');
          } catch (err) {
            console.error('PDF export failed:', err);
            showToast('PDF generation encountered an error.');
          } finally {
            pdfStagingArea.innerHTML = '';
          }
        });
      }

      // Initialize Application
      handleComposerInput();
      fetchMessages();
      setInterval(fetchMessages, 5000);

    })();
  </script>
</body>
</html>
