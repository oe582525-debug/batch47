<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Batch-47 | Anonymous Feed</title>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-client@2"></script>
  <!-- html2pdf Library for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-color: #050508;
      --card-bg: #0b0b10;
      --input-bg: #08080d;
      --border-color: #1a1618;
      --accent-red: #d9232e;
      --accent-red-hover: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #808493;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      /* Prevents double-tap zoom on mobile devices */
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Watermark '47' */
    body::before {
      content: "47";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(220px, 55vw, 450px);
      font-weight: 900;
      color: rgba(217, 35, 46, 0.025);
      z-index: 0;
      pointer-events: none;
      font-family: 'Times New Roman', Georgia, serif;
      user-select: none;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    /* Header Styling */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-circle {
      width: 40px;
      height: 40px;
      background: #8e181f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(217, 35, 46, 0.3);
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .brand-title {
      font-family: 'Georgia', serif;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-subtitle {
      font-size: 9px;
      color: var(--accent-red);
      letter-spacing: 1.4px;
      font-weight: 600;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .menu-btn:hover {
      background: rgba(217, 35, 46, 0.1);
    }

    /* Post Input Card */
    .input-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .textarea-wrapper {
      background: var(--input-bg);
      border: 1px solid #161214;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .post-input {
      width: 100%;
      height: 85px;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      line-height: 1.4;
    }

    .post-input::placeholder {
      color: #4b4d58;
    }

    .word-counter {
      text-align: right;
      font-size: 11px;
      color: #636674;
      font-weight: 600;
      margin-top: 6px;
    }

    .word-counter.limit-near { color: #f59e0b; }
    .word-counter.limit-reached { color: #ef4444; }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .post-btn {
      background: var(--accent-red);
      color: #ffffff;
      border: none;
      padding: 10px 28px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(217, 35, 46, 0.4);
      transition: all 0.2s;
      user-select: none;
    }

    .post-btn:hover {
      background: var(--accent-red-hover);
    }

    .post-btn:active {
      transform: scale(0.97);
    }

    .post-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Timeline Bar */
    .timeline-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .timeline-title {
      color: #838896;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .expiry-text {
      color: #4b4e5a;
      letter-spacing: 0.3px;
    }

    /* Posts Feed List */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      transition: border-color 0.2s;
    }

    .post-card:hover {
      border-color: rgba(217, 35, 46, 0.2);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #636674;
    }

    .post-author {
      font-weight: 600;
      color: #9ca3af;
    }

    .post-time {
      font-size: 11px;
      color: #525562;
    }

    .post-content {
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #636674;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: var(--accent-red);
    }

    /* Navigation Dropdown Menu */
    .dropdown-menu {
      position: absolute;
      top: 60px;
      right: 16px;
      background: #101017;
      border: 1px solid #282836;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      flex-direction: column;
      overflow: hidden;
      min-width: 200px;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 12px 16px;
      color: #d1d5db;
      font-size: 13px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .dropdown-item:hover {
      background: rgba(217, 35, 46, 0.15);
      color: #fff;
    }

    /* Template Container for PDF Export */
    #pdf-container {
      display: none;
      background: #ffffff;
      color: #000000;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    #pdf-container h2 {
      margin-bottom: 5px;
      color: #b91c1c;
    }

    .pdf-post-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
    }

    .pdf-meta {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- App Header -->
    <header class="header">
      <div class="brand-section">
        <div class="logo-circle">47</div>
        <div class="title-group">
          <h1 class="brand-title">Batch-47</h1>
          <span class="brand-subtitle">ANONYMOUS FEED</span>
        </div>
      </div>
      <button class="menu-btn" id="menu-toggle-btn" title="Menu">⋮</button>
    </header>

    <!-- Top Dropdown Menu -->
    <div class="dropdown-menu" id="dropdown-menu">
      <button class="dropdown-item" id="export-pdf-btn">📄 Export Feed History (PDF)</button>
    </div>

    <!-- Post Creation Box -->
    <section class="input-card">
      <div class="textarea-wrapper">
        <textarea 
          id="post-text" 
          class="post-input" 
          placeholder="Tell Batch-47 anonymously... (Max 47 words)"
        ></textarea>
        <div class="word-counter" id="word-count-display">0 / 47 words</div>
      </div>

      <div class="card-actions">
        <button class="post-btn" id="submit-post-btn">Post Now</button>
      </div>
    </section>

    <!-- Realtime Timeline Label -->
    <div class="timeline-bar">
      <div class="timeline-title">
        <span class="live-dot"></span> LIVE TIMELINE
      </div>
      <div class="expiry-text">Auto-expires after 30 days</div>
    </div>

    <!-- Live Posts Container -->
    <main class="posts-list" id="posts-container">
      <div style="text-align: center; color: #636674; font-size: 13px; padding: 20px;">
        Connecting to live feed...
      </div>
    </main>
  </div>

  <!-- Hidden Container for generating PDF -->
  <div id="pdf-container"></div>

  <script>
    // ==========================================
    // 1. SUPABASE CLIENT & AUTO REGISTRATION
    // ==========================================
    const SUPABASE_URL = "https://oeipqyttvkxqrtzesowb.supabase.co/rest/v1/";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9laXBxeXR0dmt4cXJ0emVzb3diIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDkzNjAsImV4cCI6MjEwNTMyNTM2MH0.nkZXFz89-9MhDqjnjOUS5QXp48m5FG91JqpdfxPifoE";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-Register user by creating a unique ID if not present
    let currentUserId = localStorage.getItem("b47_anon_id");
    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
      localStorage.setItem("b47_anon_id", currentUserId);
    }

    // ==========================================
    // 2. WORD COUNT MANAGEMENT (Max 47 Words)
    // ==========================================
    const postTextInput = document.getElementById("post-text");
    const wordCountDisplay = document.getElementById("word-count-display");

    function getWordCount(str) {
      const trimmed = str.trim();
      return trimmed === "" ? 0 : trimmed.split(/\s+/).length;
    }

    postTextInput.addEventListener("input", () => {
      const count = getWordCount(postTextInput.value);
      wordCountDisplay.innerText = `${count} / 47 words`;

      if (count > 47) {
        wordCountDisplay.className = "word-counter limit-reached";
      } else if (count >= 40) {
        wordCountDisplay.className = "word-counter limit-near";
      } else {
        wordCountDisplay.className = "word-counter";
      }
    });

    // ==========================================
    // 3. SUBMIT POST FUNCTIONALITY
    // ==========================================
    const submitPostBtn = document.getElementById("submit-post-btn");

    submitPostBtn.addEventListener("click", async (e) => {
      e.preventDefault();
      const content = postTextInput.value.trim();
      const wordCount = getWordCount(content);

      if (!content) {
        alert("Please write a message before posting!");
        return;
      }

      if (wordCount > 47) {
        alert("Maximum 47 words allowed per post!");
        return;
      }

      submitPostBtn.disabled = true;
      submitPostBtn.innerText = "Posting...";

      try {
        const { error } = await db.from("posts").insert([
          {
            content: content,
            user_id: currentUserId
          }
        ]);

        if (error) throw error;

        // Reset input on success
        postTextInput.value = "";
        wordCountDisplay.innerText = "0 / 47 words";

      } catch (err) {
        alert("Failed to send message: " + (err.message || "Network error"));
      } finally {
        submitPostBtn.disabled = false;
        submitPostBtn.innerText = "Post Now";
      }
    });

    // ==========================================
    // 4. FETCH POSTS & REALTIME WEBSOCKET LISTEN
    // ==========================================
    const postsContainer = document.getElementById("posts-container");

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const date = new Date(dateStr);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ', ' + date.toLocaleDateString();
    }

    function escapeHTML(str) {
      return (str || "").replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    async function fetchPosts() {
      try {
        const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();

        const { data: posts, error } = await db
          .from("posts")
          .select("*")
          .gte("created_at", thirtyDaysAgo)
          .order("created_at", { ascending: false });

        if (error) {
          postsContainer.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 20px;">Database Error: ${error.message}</div>`;
          return;
        }

        if (!posts || posts.length === 0) {
          postsContainer.innerHTML = `<div style="text-align: center; color: #636674; padding: 20px;">No messages yet. Be the first to post!</div>`;
          return;
        }

        postsContainer.innerHTML = posts.map(post => {
          // Verify if post belongs to current user
          const isOwner = post.user_id === currentUserId;

          return `
            <div class="post-card" id="post-${post.id}">
              <div class="post-header">
                <span class="post-author">Anonymous</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <span class="post-time">${formatDate(post.created_at)}</span>
                  ${isOwner ? `<button class="delete-btn" onclick="deletePost('${post.id}')" title="Delete your post">🗑️</button>` : ''}
                </div>
              </div>
              <div class="post-content">${escapeHTML(post.content)}</div>
            </div>
          `;
        }).join("");

      } catch (err) {
        postsContainer.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 20px;">Connection Error: ${err.message}</div>`;
      }
    }

    // Supabase Realtime WebSocket Listener
    db.channel('public:posts')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
        fetchPosts();
      })
      .subscribe();

    // Initial Load
    fetchPosts();

    // ==========================================
    // 5. DELETE OWN POST ACTION
    // ==========================================
    window.deletePost = async (postId) => {
      if (confirm("Are you sure you want to delete your post?")) {
        const { error } = await db.from("posts").delete().eq("id", postId).eq("user_id", currentUserId);
        if (error) {
          alert("Could not delete message: " + error.message);
        } else {
          fetchPosts();
        }
      }
    };

    // ==========================================
    // 6. UI TOGGLES & PDF EXPORT
    // ==========================================
    const menuBtn = document.getElementById("menu-toggle-btn");
    const dropdownMenu = document.getElementById("dropdown-menu");

    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle("show");
    });

    document.addEventListener("click", () => dropdownMenu.classList.remove("show"));

    // PDF Backup Export Action
    document.getElementById("export-pdf-btn").addEventListener("click", async () => {
      dropdownMenu.classList.remove("show");

      const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
      const { data: posts } = await db.from("posts").select("*").gte("created_at", thirtyDaysAgo).order("created_at", { ascending: true });

      if (!posts || posts.length === 0) {
        alert("No chat history available to export.");
        return;
      }

      const pdfContainer = document.getElementById("pdf-container");
      pdfContainer.style.display = "block";
      
      pdfContainer.innerHTML = `
        <h2>Batch-47 Anonymous Feed</h2>
        <p style="font-size: 11px; color: #666; margin-bottom: 12px;">Exported Feed History (30 Days)</p>
        <div>
          ${posts.map(p => `
            <div class="pdf-post-item">
              <div class="pdf-meta"><strong>Anonymous</strong> - ${formatDate(p.created_at)}</div>
              <div style="font-size: 13px;">${escapeHTML(p.content)}</div>
            </div>
          `).join('')}
        </div>
      `;

      const opt = {
        margin: 10,
        filename: 'Batch47_Feed_History.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(pdfContainer).save().then(() => {
        pdfContainer.style.display = "none";
      });
    });
  </script>
</body>
</html>
